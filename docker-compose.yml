# Local run of the exact image Render builds. The app repo's docker-compose.yml starts this
# same build as part of the parity stack.
#
#   docker compose up -d
#   ./scripts/rotate-test.sh          # X11 on its own, no app involved
services:
  db:
    build:
      context: .
    image: proof-erpnext-db:local
    restart: unless-stopped
    ports:
      # Published only for local mysql clients; Render reaches this service on the private
      # network at erpnext-db-<hash>:10000 and never publishes a port.
      - "${DB_LOCAL_PORT:-13306}:10000"
    # Only the plan-dependent tuning. The port, utf8mb4/unicode_ci, the client-handshake skip and
    # skip-innodb-read-only-compressed are baked into the image at
    # /etc/mysql/conf.d/render.cnf, so they are correct here for the same reason they are on Render.
    command:
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL:-768M}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-proof-root-password}
      MARIADB_DATABASE: ${DB_NAME:-erpnext}
      MARIADB_USER: ${DB_USER:-erpnext}
      MARIADB_PASSWORD: ${DB_PASSWORD:-proof-db-password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # A bare TCP connect to 10000 - exactly the question Render's pserv probe asks (X9), and the
      # only shape of check that needs no credential. The obvious `mariadb-admin ping` authenticates
      # (so it fails for reasons that have nothing to do with reachability) and puts the root
      # password in `docker inspect`. Render cannot do either, so neither do we.
      test: ["CMD-SHELL", "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/10000'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db-data:
